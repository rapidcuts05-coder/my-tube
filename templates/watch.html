<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ video.title }} — MyTube</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h2>{{ video.title }}</h2>

<p>Uploaded by {{ video.username }}</p>

<video width="600" controls poster="/thumbs/{{video.thumbnail}}">
  <source src="/videos/{{video.filename}}">
</video>

<p>{{ video.description }}</p>

<br>
<a href="/">Back</a>

</body>
</html>
