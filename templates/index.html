<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MyTube</title>

<style>

body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f0f0f;
    color:white;
}

/* TOP NAVBAR */

.navbar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#202020;
    padding:10px 20px;
}

.logo {
    font-size:22px;
    font-weight:bold;
    color:red;
}

.search-box input {
    padding:8px;
    width:300px;
    background:#121212;
    border:1px solid #333;
    color:white;
}

.nav-right a {
    color:white;
    margin-left:15px;
    text-decoration:none;
}

/* VIDEO GRID */

.container {
    padding:20px;
}

.video-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap:20px;
}

.video-card {
    background:#181818;
    padding:10px;
    border-radius:8px;
    transition:0.2s;
}

.video-card:hover {
    background:#222;
}

.video-card img {
    width:100%;
    border-radius:6px;
}

.video-title {
    margin-top:8px;
    font-size:16px;
}

.video-date {
    font-size:12px;
    color:gray;
}

</style>
</head>

<body>

<div class="navbar">

    <div class="logo">
        MyTube
    </div>

    <div class="search-box">
        <input placeholder="Search">
    </div>

    <div class="nav-right">

        {% if session.get("user") %}

            Welcome {{session["name"]}}

            <a href="/upload">Upload</a>
            <a href="/logout">Logout</a>

        {% else %}

            <a href="/login">Login</a>
            <a href="/register">Register</a>

        {% endif %}

    </div>

</div>


<div class="container">

<div class="video-grid">

{% for v in videos %}

<a href="/watch/{{v[0]}}" style="text-decoration:none;color:white;">

<div class="video-card">

<img src="/thumbs/{{v[4]}}">

<div class="video-title">
{{v[2]}}
</div>

<div class="video-date">
{{v[6]}}
</div>

</div>

</a>

{% endfor %}

</div>

</div>

</body>
</html>
